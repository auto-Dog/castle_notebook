[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-notebook"
version = "0.9.0"
description = "A local, inspectable AI-assisted notebook for algorithm and quantitative research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ipython>=8.18"]

[project.scripts]
castle-notebook = "castle_notebook.server:main"

[tool.setuptools.package-data]
castle_notebook = ["static/*", "context.default.json"]

[tool.setuptools.packages.find]
include = ["castle_notebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
